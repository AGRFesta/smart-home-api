spring.application.name=smart-home-api
# TTL for the per-device battery cache key (devices:{provider}:{id}:battery).
# A small multiple of the polling interval so an offline device lets its value expire (#191).
smart-home.cache.battery-ttl=5m
# Global BATTERY_LOW thresholds (%): the alert opens at trigger or below and resolves only at
# clear or above (hysteresis band, #193). clear must be strictly greater than trigger.
alerts.battery-low.trigger=15
alerts.battery-low.clear=25
# Reminder cadence for OPEN alerts (ISO-8601): a reminder notification is re-emitted no more often
# than this while the alert stays open (#194). The scheduler scan only bounds the latency.
alerts.notifications.reminder-interval=PT24H
# Retention window (ISO-8601) for persisted notifications: older rows are pruned daily (#194).
alerts.notifications.retention=P90D
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
